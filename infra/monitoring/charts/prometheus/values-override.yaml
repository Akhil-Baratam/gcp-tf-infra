# Reduced resource configuration for kube-prometheus-stack

prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

grafana:
  grafana.ini:
    server:
      domain: "grafana.34.49.38.142.nip.io"
      root_url: "http://grafana.34.49.38.142.nip.io/"
    auth.google:
      enabled: true
      client_id: "${google_oauth_client_id}"
      client_secret: "${google_oauth_client_secret}"
      scopes: openid email profile
      auth_url: https://accounts.google.com/o/oauth2/v2/auth
      token_url: https://oauth2.googleapis.com/token
      api_url: https://openidconnect.googleapis.com/v1/userinfo
      allow_sign_up: true
      auto_login: false
      role_attribute_strict: true
      role_attribute_path: "contains(['nitish.kumar.cs57@gmail.com','akhilbaratamtct@gmail.com'], email) && 'Admin' || ''"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
